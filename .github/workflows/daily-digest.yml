name: Daily job digest

on:
  schedule:
    - cron: "0 7 * * *"   # 7:00 UTC — 8:00 BST (summer) / 7:00 GMT (winter)
    # To run twice a week instead, replace the line above with:
    # - cron: "0 7 * * 1,4"   # Monday and Thursday only
  workflow_dispatch:        # allow manual trigger for testing

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          SPONSOR_CSV_URL: ${{ secrets.SPONSOR_CSV_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python digest.py

      - name: Commit today's jobs and cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f today_jobs.json ] && git add -f today_jobs.json
          [ -f job_score_cache.json ] && git add -f job_score_cache.json
          [ -f search_plan_cache.json ] && git add -f search_plan_cache.json
          git diff --staged --quiet || (git commit -m "chore: update cache and today_jobs.json [skip ci]" && git pull --rebase origin main && git push)
